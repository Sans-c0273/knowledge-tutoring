[project]
name = "socratic-tutor-poc"
version = "0.1.0"
description = "Socratic AI Tutor POC — rule-driven Pedagogy Layer over Claude"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "chromadb>=0.5.20",
    "sentence-transformers>=3.3",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.12",
    "networkx>=3.4",
    "claude-agent-sdk==0.2.144",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[project.scripts]
poc = "socratic_tutor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socratic_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A blocked test must fail with a traceback, never hang the suite. `thread` and
# not the default `signal` method: Python only runs signal handlers between
# bytecodes, so SIGALRM cannot interrupt a stall inside a C extension — which is
# where the stalls actually observed here happened (chromadb's Rust bindings).
# The thread method dumps every thread's stack and kills the process regardless.
timeout = 30
timeout_method = "thread"
addopts = "--timeout=30"

[tool.ruff]
line-length = 100
target-version = "py311"
