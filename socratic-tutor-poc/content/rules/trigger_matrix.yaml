# Trigger Matrix — Tech Spec §3.1 ("which strategy?")
#
# Each row is keyed on four fields: intent, learner_state, student_level,
# special_handling. `any` is a wildcard that matches every value of that field.
#
# Matching (implemented in pedagogy/strategy.py):
#   1. a row matches when every key field is `any` or equals the lookup value;
#   2. candidates sort by (priority DESC, specificity DESC, row id ASC), where
#      specificity = the number of non-`any` key fields — so an exact row beats
#      a wildcard row at equal priority, and the id sort makes ties deterministic;
#   3. no candidate → `fallback` is used and the miss is emitted as a structured
#      review-queue event (Architecture, risk row "Rule-table gaps").
#
# `source: spec` rows are the seed rows of the §3.1 table, verbatim.
# `source: extension` rows fill gaps the seed table leaves (the `clarify` intent,
# non-beginner levels, and non-`check_answer` homework turns). Priorities are
# chosen so every extension sits *below* the specific seed row it generalises.

version: "1.0.0"
description: >-
  Trigger Matrix seeded from Technical Specification §3.1, extended with the
  rows the seed table does not cover (clarify, level wildcards, generic homework).

# Used when no row matches. Fail-safe, not fail-open: asking one understanding
# question can never leak an answer. Every use is logged as an unmatched lookup.
fallback:
  id: TM_FALLBACK
  primary: S07
  supporting: []
  note: Safe generic turn for an uncovered key; the miss feeds the review queue.

rows:
  - id: TM01
    source: spec
    intent: explain
    learner_state: normal
    student_level: beginner
    special_handling: none
    primary: S01
    supporting: [S02, S07]
    priority: 50

  - id: TM02
    source: extension
    note: Same as TM01 for intermediate/advanced; sits below the beginner row.
    intent: explain
    learner_state: normal
    student_level: any
    special_handling: none
    primary: S01
    supporting: [S02, S07]
    priority: 45

  - id: TM03
