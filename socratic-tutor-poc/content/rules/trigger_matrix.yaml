  - id: TM16
    source: extension
    note: >-
      Generic homework turn. Teaching Policy row 2 is hint-first + attempt
      required, so the strategy default under homework is the hint. Priority sits
      below TM12 so the specific check_answer homework row still wins.
    intent: any
    learner_state: any
    student_level: any
    special_handling: homework
    primary: S04
    supporting: [S03, S07]
    priority: 55

  - id: TM17
    source: spec
    note: >-
      Seed row `any + any / assessment`, "per Teaching Policy row 3". Row 3 is
      the strictest context in §3.4, and a hint toward a graded answer is still
      substantive assistance toward that answer — it differs from a direct answer
      in degree, not in kind. During an assessment the tutor stops being a help
      channel: it acknowledges the context and puts the work back on the student.
      Hence S07 alone, and no supporting clue-emitting strategy. Priority 90
      makes assessment outrank every other row.
    intent: any
    learner_state: any
    student_level: any
    special_handling: assessment
    primary: S07
    supporting: []
    priority: 90
