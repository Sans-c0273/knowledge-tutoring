[project]
name = "kg-mapper-poc"
version = "0.1.0"
description = "Knowledge-graph extraction POC: course materials and notes to atomic Markdown nodes"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # LLM providers (DESIGN §1, §7)
    "claude-agent-sdk==0.2.144",
    "openai==3.3.1",
    # Schemas
    "pydantic>=2.13,<3",
    # Conversion (DESIGN §1, §4)
    "markitdown[pptx,docx]==0.1.7",
    "pdfplumber>=0.11,<0.12",
    "openpyxl==3.1.5",
    "trafilatura==2.2.0",
    "Pillow>=12.3,<13",
    # Config / env / self-test (R18, R20)
    "PyYAML>=6.0,<7",
    "python-dotenv>=1,<2",
    "pytest>=9,<10",
]

[project.optional-dependencies]
# Provider 3 (optional, D26): Console API-key adapter.
anthropic-api = ["anthropic==1.0.0"]

[project.scripts]
kg = "kg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
