<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__KG_TITLE__</title>
<style>
  :root {
    --bg: #0d0d0f; --panel: #151518; --panel2: #1c1c21; --border: #2a2a31;
    --text: #e8e8ea; --dim: #9a9aa3; --faint: #6a6a73; --hit: #ffd866;
    --node: #c0caf5; --node-dim: #565f89; --selected: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", "Thonburi", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap;
  }
  header h1 { font-size: 14px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
  header h1 small { color: var(--faint); font-weight: 400; margin-left: 8px; }
  #search {
    flex: 1; min-width: 180px; max-width: 420px; padding: 7px 13px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 14px; outline: none;
  }
  #search:focus { border-color: var(--dim); }
  .range { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); white-space: nowrap; }
  .range input[type=range] { width: 130px; accent-color: #7aa2f7; }
  .range output { min-width: 2.2em; color: var(--text); font-variant-numeric: tabular-nums; }
  #edge-filters { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--dim); font-size: 12px;
    cursor: pointer; user-select: none;
  }
  /* Visually hidden but still focusable: chips stay keyboard-operable (Tab + Space). */
  .chip input { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .chip:focus-within { outline: 2px solid var(--hit); outline-offset: 1px; }
  .chip .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; opacity: .35; }
  .chip.on { color: var(--text); border-color: var(--dim); }
  .chip.on .swatch { opacity: 1; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); cursor: pointer; white-space: nowrap; }
  .toggle input { accent-color: #7aa2f7; }
  #problems {
    margin-left: auto; padding: 4px 10px; border: 1px solid #e0af68; border-radius: 999px;
    color: #e0af68; font-size: 12px; cursor: help; white-space: nowrap;
  }
  #problems[hidden] { display: none; }
  main { flex: 1; display: flex; min-height: 0; }
  #graph { flex: 1; min-width: 0; position: relative; }
  #inspector {
    width: 360px; flex-shrink: 0; overflow-y: auto; padding: 18px 20px;
    background: var(--panel); border-left: 1px solid var(--border); font-size: 13px;
  }
  #inspector h2 { font-size: 17px; line-height: 1.3; margin-bottom: 4px; }
  #inspector h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 18px 0 6px; }
  #inspector .id { color: var(--dim); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  #inspector .meta { color: var(--faint); font-size: 12px; margin-top: 2px; }
  #inspector .origin { display: inline-block; margin-top: 8px; padding: 1px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--border); font-size: 11px; color: var(--dim); }
  #inspector .aliases { color: var(--dim); margin-top: 6px; font-size: 12px; }
  #inspector p { color: var(--text); }
  #inspector ul { list-style: none; }
  #inspector li { padding: 5px 0; border-bottom: 1px solid var(--border); }
  #inspector li:last-child { border-bottom: 0; }
  #inspector code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: #7dcfff; word-break: break-all; }
  #inspector blockquote { margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--border); color: var(--dim); font-size: 12px; }
  #inspector .rel { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  #inspector .rel:hover { color: var(--hit); }
  #inspector .rel .swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  #inspector .rel .type { color: var(--faint); font-size: 11px; }
  #inspector .rel .score { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  #inspector .empty { color: var(--dim); }
  #inspector .legend { margin-top: 14px; }
  #inspector .legend li { display: flex; align-items: center; gap: 8px; border: 0; padding: 3px 0; color: var(--dim); font-size: 12px; }
  #inspector .legend .line { width: 28px; height: 0; border-top: 2px solid; flex-shrink: 0; }
  #inspector .legend .line.dashed { border-top-style: dashed; }
  #inspector .legend .line.dotted { border-top-style: dotted; }
  #inspector .degree { color: var(--faint); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>__KG_TITLE__ <small id="stats">__KG_SUBTITLE__</small></h1>
  <input id="search" type="search" placeholder="Search title or alias…" autocomplete="off" spellcheck="false">
  <label class="range">min relevance
    <input id="min-relevance" type="range" min="0" max="100" step="1" value="0">
    <output id="min-relevance-value" for="min-relevance">0</output>
  </label>
  <div id="edge-filters" aria-label="edge types"></div>
  <label class="toggle"><input id="hide-isolated" type="checkbox"> hide isolated</label>
  <span id="problems" hidden></span>
</header>
<main>
  <div id="graph"></div>
  <aside id="inspector"></aside>
</main>
<script id="graph-data" type="application/json">__KG_GRAPH_JSON__</script>
<script>
__KG_VENDOR_JS__
</script>
<script>
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('graph-data').textContent);
  var STYLES = DATA.styles || {};
  var META = DATA.meta || {};
  var FALLBACK = { color: '#565f89', dash: [], arrow: false, label: '' };
  var PALETTE = { text: '#e8e8ea', node: '#c0caf5', nodeDim: '#565f89', hit: '#ffd866', selected: '#ffffff', bg: '#0d0d0f' };

  var nodesById = {};
  DATA.nodes.forEach(function (n) { nodesById[n.id] = n; });

  var edgeTypes = Object.keys(STYLES);
  DATA.edges.forEach(function (e) { if (edgeTypes.indexOf(e.type) < 0) { edgeTypes.push(e.type); } });

  var state = { search: '', minRelevance: 0, types: {}, hideIsolated: false, selected: null, hits: null };
  edgeTypes.forEach(function (t) { state.types[t] = true; });

  function styleFor(type) { return STYLES[type] || FALLBACK; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function withAlpha(hex, alpha) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    if (!m) { return hex; }
    return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + alpha.toFixed(3) + ')';
  }

  function excerpt(text, max) {
    text = String(text || '');
    return text.length > max ? text.slice(0, max - 1).replace(/\s+\S*$/, '') + '…' : text;
  }

  function hasRelevance(e) { return e.type === 'related_to' && typeof e.relevance === 'number'; }

  function matches(n, q) {
    if (n.title.toLowerCase().indexOf(q) >= 0) { return true; }
    return (n.aliases || []).some(function (a) { return a.toLowerCase().indexOf(q) >= 0; });
  }

  function edgeVisible(e) {
    if (!state.types[e.type]) { return false; }
    if (hasRelevance(e) && e.relevance < state.minRelevance) { return false; }
    return true;
  }

  // Filters are applied client-side over the embedded payload; node objects are reused so
  // force-graph keeps their positions between refreshes.
  function currentData() {
    var q = state.search.trim().toLowerCase();
    var keep = {};
    var hits = null;
    if (q) {
      hits = {};
      DATA.nodes.forEach(function (n) { if (matches(n, q)) { hits[n.id] = true; keep[n.id] = true; } });
      DATA.edges.forEach(function (e) {
        if (edgeVisible(e) && (hits[e.source] || hits[e.target])) { keep[e.source] = true; keep[e.target] = true; }
      });
    } else {
      DATA.nodes.forEach(function (n) { keep[n.id] = true; });
    }
    state.hits = hits;
    var links = DATA.edges.filter(function (e) { return edgeVisible(e) && keep[e.source] && keep[e.target]; });
    var linked = {};
    links.forEach(function (e) { linked[e.source] = true; linked[e.target] = true; });
    var nodes = DATA.nodes.filter(function (n) { return keep[n.id] && (!state.hideIsolated || linked[n.id]); });
    return {
      nodes: nodes,
      links: links.map(function (e) { return { source: e.source, target: e.target, type: e.type, relevance: e.relevance }; })
    };
  }

  var container = document.getElementById('graph');
  var graph = ForceGraph()(container)
    .backgroundColor(PALETTE.bg)
    .nodeId('id')
    .nodeLabel(function (n) { return esc(n.title) + (n.aliases && n.aliases.length ? '<br><span style="color:#9a9aa3">' + esc(n.aliases.join(', ')) + '</span>' : ''); })
    .nodeVal(function (n) { return 1 + Math.sqrt(n.degree || 0); })
    .nodeColor(function (n) {
      if (state.selected && n.id === state.selected.id) { return PALETTE.selected; }
      if (state.hits) { return state.hits[n.id] ? PALETTE.hit : PALETTE.nodeDim; }
      return PALETTE.node;
    })
    .linkColor(function (l) {
      var s = styleFor(l.type);
      return hasRelevance(l) ? withAlpha(s.color, 0.25 + 0.75 * (l.relevance / 100)) : s.color;
    })
    .linkWidth(function (l) { return hasRelevance(l) ? 0.5 + 3.5 * (l.relevance / 100) : 1.2; })
    .linkLineDash(function (l) { var d = styleFor(l.type).dash; return d && d.length ? d : null; })
    .linkDirectionalArrowLength(function (l) { return styleFor(l.type).arrow ? 5 : 0; })
    .linkDirectionalArrowRelPos(1)
    .linkLabel(function (l) { return esc(l.type) + (hasRelevance(l) ? ' · relevance ' + l.relevance : ''); })
    .onNodeClick(function (n) { select(n, true); })
    .onBackgroundClick(function () { select(null, false); });

  function resize() { graph.width(container.clientWidth).height(container.clientHeight); }
  window.addEventListener('resize', resize);
  resize();

  function refresh() {
    var d = currentData();
    graph.graphData(d);
    document.getElementById('stats').textContent =
      'schema ' + (META.schema || '?') + ' · ' + d.nodes.length + ' of ' + DATA.nodes.length + ' nodes · ' + d.links.length + ' of ' + DATA.edges.length + ' edges';
  }

  // Inspector -------------------------------------------------------------
  var inspector = document.getElementById('inspector');

  function legendHtml() {
    var items = edgeTypes.map(function (t) {
      var s = styleFor(t);
      var cls = s.dash && s.dash.length ? (s.dash[0] <= 2 ? 'dotted' : 'dashed') : '';
      return '<li><span class="line ' + cls + '" style="border-color:' + esc(s.color) + '"></span>' + esc(t) + (s.arrow ? ' →' : '') + '</li>';
    });
    return '<ul class="legend">' + items.join('') + '</ul>';
  }

  function emptyInspector() {
    inspector.innerHTML =
      '<div class="empty">Click a node to inspect it.<br><br>' +
      'Search matches titles and aliases; the slider hides <code>related_to</code> edges below the chosen relevance; ' +
      'chips toggle edge types.</div>' +
      '<h3>Edge types</h3>' + legendHtml() +
      '<h3>Corpus</h3><div class="meta">' + esc(META.corpus || '') + (META.run ? ' · run ' + esc(META.run) : '') + (META.provider ? ' · ' + esc(META.provider) : '') + '</div>';
  }

  function relationsOf(n) {
    var out = [];
    DATA.edges.forEach(function (e) {
      var other = e.source === n.id ? e.target : (e.target === n.id ? e.source : null);
      if (other === null || !nodesById[other]) { return; }
      var directed = styleFor(e.type).arrow;
      var label = directed ? (e.source === n.id ? e.type + ' →' : '← ' + e.type) : e.type;
      out.push({ id: other, title: nodesById[other].title, type: e.type, label: label, relevance: hasRelevance(e) ? e.relevance : null });
    });
    out.sort(function (a, b) {
      if (a.relevance !== null && b.relevance !== null && a.relevance !== b.relevance) { return b.relevance - a.relevance; }
      return a.title.localeCompare(b.title);
    });
    return out;
  }

  function select(n, center) {
    state.selected = n;
    if (!n) { emptyInspector(); graph.nodeColor(graph.nodeColor()); return; }
    var rels = relationsOf(n);
    var html = '<h2>' + esc(n.title) + '</h2>' +
      '<div class="id">' + esc(n.id) + '</div>' +
      '<div class="meta">' + esc(n.provider || '') + ' · ' + esc(n.model || '') + '</div>';
    if (n.origin) { html += '<div class="origin">origin: ' + esc(n.origin) + '</div>'; }
    if (n.aliases && n.aliases.length) { html += '<div class="aliases">aliases: ' + esc(n.aliases.join(', ')) + '</div>'; }
    html += '<h3>Definition</h3><p>' + esc(excerpt(n.definition_plain, 700)) + '</p>';
    html += '<h3>Sources</h3><ul>' + (n.sources || []).map(function (s) {
      return '<li><code>' + esc(s.locator) + '</code>' + (s.quote ? '<blockquote>' + esc(s.quote) + '</blockquote>' : '') + '</li>';
    }).join('') + '</ul>';
    html += '<h3>Relations <span class="degree">degree ' + (n.degree || 0) + '</span></h3><ul>' + rels.map(function (r) {
      return '<li class="rel" data-id="' + esc(r.id) + '"><span class="swatch" style="background:' + esc(styleFor(r.type).color) + '"></span>' +
        '<span>' + esc(r.title) + ' <span class="type">' + esc(r.label) + '</span></span>' +
        (r.relevance !== null ? '<span class="score">' + r.relevance + '</span>' : '') + '</li>';
    }).join('') + '</ul>';
    html += '<h3>File</h3><code>' + esc(n.file) + '</code>';
    inspector.innerHTML = html;
    graph.nodeColor(graph.nodeColor());
    if (center && typeof n.x === 'number') { graph.centerAt(n.x, n.y, 500); }
  }

  inspector.addEventListener('click', function (ev) {
    var row = ev.target.closest ? ev.target.closest('.rel') : null;
    if (!row) { return; }
    var n = nodesById[row.getAttribute('data-id')];
    if (n) { select(n, true); }
  });

  // Controls --------------------------------------------------------------
  var filters = document.getElementById('edge-filters');
  edgeTypes.forEach(function (t) {
    var s = styleFor(t);
    var chip = document.createElement('label');
    chip.className = 'chip on';
    chip.innerHTML = '<input type="checkbox" checked data-type="' + esc(t) + '"><span class="swatch" style="background:' + esc(s.color) + '"></span>' + esc(t);
    filters.appendChild(chip);
  });
  filters.addEventListener('change', function (ev) {
    var t = ev.target.getAttribute('data-type');
    if (!t) { return; }
    state.types[t] = ev.target.checked;
    ev.target.parentNode.classList.toggle('on', ev.target.checked);
    refresh();
  });

  document.getElementById('search').addEventListener('input', function (ev) { state.search = ev.target.value; refresh(); });

  var slider = document.getElementById('min-relevance');
  var sliderValue = document.getElementById('min-relevance-value');
  slider.addEventListener('input', function (ev) {
    state.minRelevance = Number(ev.target.value) || 0;
    sliderValue.textContent = String(state.minRelevance);
    refresh();
  });

  document.getElementById('hide-isolated').addEventListener('change', function (ev) { state.hideIsolated = ev.target.checked; refresh(); });

  // Esc clears the selected node (keyboard counterpart of clicking the background).
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && state.selected) { select(null, false); }
  });

  var problems = META.problems || [];
  if (problems.length) {
    var badge = document.getElementById('problems');
    badge.hidden = false;
    badge.textContent = problems.length + ' file(s) skipped';
    badge.title = problems.map(function (p) { return p.file + ': ' + p.reason; }).join('\n');
  }

  emptyInspector();
  refresh();
})();
</script>
</body>
</html>
