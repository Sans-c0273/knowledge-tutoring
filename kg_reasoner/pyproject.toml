[project]
name = "kg-reasoner"
version = "0.1.0"
description = "Identifies which kg-mapper-poc knowledge-graph nodes support teaching feedback for one student turn"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_reasoner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
